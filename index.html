<script>
const $=s=>document.querySelector(s),RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function btn(c,x,fn){const b=el('button',c,x);b.type='button';b.onclick=fn;return b}
const HEX='<svg viewBox="0 0 34 34" fill="rgba(7,9,12,.8)" stroke="#7FD1AE" stroke-width="2.5" aria-hidden="true"><path d="M17 3l12 7v14l-12 7-12-7V10z"/><circle cx="17" cy="17" r="3" fill="#7FD1AE" stroke="none"/></svg>';
const META=[['Harel','#7FD1AE','core · who I am',[]],
['Career','#6C8CFF','four roles in seven years',['Data product','Analysis ops','Partnerships','Research team']],
['Field notes','#38BDF8','what I am like to work with',['Asks','Plans first','Samples','Corrects','Truth','User first','Delegates']],
['Geospatial','#2DD4BF','my home ground'],['Products & agents','#F2A33A','products and teams of AI agents'],
['Computer vision','#A78BFA','teaching machines to see'],['Games & film','#F472B6','games, a film and a tunnel'],
['Skills','#A3E635','education and skills',['Strong','Working','Learning now']],
['Off the clock','#F87171','when I am not building',['Cooking','Games','Science','Maps','Parables','Ideas']],
['Contact','#E6E8EB','get in touch',['Email','LinkedIn']]];
const A=SITES.map((s,i)=>({s,i,n:META[i][0],c:META[i][1],sub:META[i][2],cat:s.cat,items:META[i][3]||s.cat.map(id=>byId[id].title)}));

const AVAIL="Israel · Hebrew (native) · English (fluent) · available from January 2027";

let sel=0,G=null,tk=0;
const LIVE={survivelmon:['https://harel-ben-or.github.io/survivalmon/','Play the real game'],hog:['https://harel-ben-or.github.io/HandOfGod-Play/','Play the real game'],'base-to-tech':['https://base-to-tech.vercel.app','Open the live app (sign-in required)']};
$('#st-n').textContent=(A.length-1)+' areas · '+PROJECTS.length+' projects';

/* ---------- typing ---------- */
function type(node,text){const my=++tk,a=el('span','typed'),b=el('span','rest');node.append(a,b);
if(RM){a.textContent=text;return}node.classList.add('typing');const s0=performance.now();
(function step(){const i=Math.floor((performance.now()-s0)*.28);if(my!==tk||i>=text.length){a.textContent=text;b.textContent='';node.classList.remove('typing');return}a.textContent=text.slice(0,i);b.textContent=text.slice(i);setTimeout(step,16)})()}
function head(kick,color,title){document.body.classList.add('open');pb.textContent='';panel.scrollTop=0;const k=el('div','lab','● '+kick);k.style.color=color;pb.append(k,el('h1',null,title))}
function say(text){const d=el('div','say');d.innerHTML=HEX;const w=el('div'),p=el('p');w.append(el('span','lab','Harel'),p);d.append(w);pb.append(d);type(p,text)}
function block(h,t,i){const b=el('div','block');if(i!=null)b.dataset.i=i;b.append(el('h3',null,h),el('p',null,t));return b}
function det(h,sub,i){const d=el('details'),s=el('summary');if(i!=null)d.dataset.i=i;s.append(el('h3',null,h));if(sub)s.append(el('span',null,sub));d.append(s);return d}
function over(node,onclose){const o=el('div','over');o.append(node);o._close=()=>{if(onclose)onclose();o.remove()};o.onclick=e=>{if(e.target===o)o._close()};document.body.append(o);return o}
function copy(text,b){const t=b.textContent;try{navigator.clipboard.writeText(text).then(()=>{b.textContent='Copied';setTimeout(()=>b.textContent=t,1600)},()=>{})}catch(e){}}
